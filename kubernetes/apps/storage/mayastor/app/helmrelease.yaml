---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mayastor
  namespace: storage
spec:
  chart:
    spec:
      chart: mayastor
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: mayastor
        namespace: flux-system
      version: 2.6.0
  interval: 1m0s
  values:
    engine:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
