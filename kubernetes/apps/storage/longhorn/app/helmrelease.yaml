---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app longhorn-release
  namespace: &namespace storage
spec:
  interval: 1m0s
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.8.1
  values:
    ingress:
      className: internal
      hosts:
        - host: "longhorn.${SECRET_DOMAIN}"
          paths:
            - path: /
              service:
                identifier: longhorn-frontend
                port: http
