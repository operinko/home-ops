---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app peanut
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: peanut
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    serviceMonitor:
      enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                NUT_HOST: "192.168.0.177"
                NUT_PORT: 3493
                USERNAME: "upsmon"
                WEB_PORT: 80
                PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: peanut-secret
                      key: password
    ingress:
      app:
        className: internal
        hosts:
          - host: peanut.vaderrp.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
