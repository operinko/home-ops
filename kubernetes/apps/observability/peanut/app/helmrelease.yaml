---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app peanut
  namespace: &namespace observability
spec:
  interval: 15m
  chart:
    spec:
      chart: peanut
      version: 6.6.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    serviceMonitor:
      enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                - name: "NUT_HOST"
                  value: "192.168.0.177"
                - name: "NUT_PORT"
                  value: 3493
                - name: "USERNAME"
                  value: "upsmon"
                - name: "WEB_PORT"
                  value: 80
                - name: "PASSWORD"
                  valueFrom:
                    secretKeyRef:
                      name: peanut-secret
                      key: password
    ingress:
      app:
        className: internal
        hosts:
          - host: peanut.vaderrp.com
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
